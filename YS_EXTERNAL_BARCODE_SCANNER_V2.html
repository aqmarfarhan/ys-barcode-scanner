<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YS Inventori</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      font-family:Arial,Helvetica,sans-serif;
      background:#0f2f6f;
      color:#fff;
    }
    .wrap{
      min-height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      box-sizing:border-box;
      text-align:center;
    }
    .card{
      max-width:520px;
      width:100%;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.18);
      border-radius:22px;
      padding:30px 24px;
      box-sizing:border-box;
      backdrop-filter:blur(8px);
    }
    h1{margin:0 0 12px;font-size:30px}
    p{margin:0;color:#e5edf9;line-height:1.5;font-size:16px}
    .spinner{
      width:42px;height:42px;
      border:4px solid rgba(255,255,255,.28);
      border-top-color:#fff;
      border-radius:50%;
      margin:24px auto 0;
      animation:spin .8s linear infinite;
    }
    .fallback{
      display:none;
      margin-top:22px;
    }
    .fallback a{
      display:inline-block;
      background:#fff;
      color:#173b8f;
      text-decoration:none;
      font-weight:700;
      padding:12px 18px;
      border-radius:10px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>YS Inventori</h1>
      <p>Membuka Sistem Pengurusan Aset & Inventori versi terkini...</p>
      <div class="spinner"></div>
      <div class="fallback" id="fallback">
        <p style="margin-bottom:12px;">Jika portal tidak terbuka secara automatik:</p>
        <a id="openPortal" href="#">Buka Portal YS Inventori</a>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const PORTAL_URL = 'https://script.google.com/macros/s/AKfycbwt8K_lamQ9s2CVKVNly7r56371SXovLDkleSw6E5g3SZd0wiLSa7u920kBDafd0GKz5w/exec';

      // Cache-buster generated automatically on every launch.
      const u = new URL(PORTAL_URL);
      u.searchParams.set('cb', Date.now().toString());

      // Preserve optional launcher query params if needed in future,
      // but never overwrite the generated cache-buster.
      const launcherParams = new URLSearchParams(window.location.search);
      launcherParams.forEach((value, key) => {
        if (key !== 'cb') u.searchParams.set(key, value);
      });

      const target = u.toString();
      document.getElementById('openPortal').href = target;

      // Use replace so the launcher does not remain in browser back history.
      setTimeout(() => {
        window.location.replace(target);
      }, 250);

      // Fallback button for restrictive browsers.
      setTimeout(() => {
        document.getElementById('fallback').style.display = 'block';
      }, 2500);
    })();
  </script>
</body>
</html>
